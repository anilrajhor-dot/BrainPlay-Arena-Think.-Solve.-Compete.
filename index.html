<!DOCTYPE html>
<html lang="en" data-theme="dark" data-contrast="false" data-motion="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Anil Sharma, Former General Manager, Central Bank of India">
<meta name="color-scheme" content="dark light">
<title>BrainPlay Arena — Think. Solve. Compete.</title>
<style>
:root{--bg:#0e1020;--bg2:#171a33;--card:#1d2142;--card2:#272c58;--ink:#f3f4ff;--mute:#b3b9de;--line:#383e74;--accent:#8b6cff;--a2:#00d1ff;--a3:#ff5fa8;--a4:#a3e635;--a5:#ffb020;--ok:#3ddc97;--bad:#ff7b7b;--r:16px;--shadow:0 8px 24px rgba(0,0,0,.35);--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
[data-theme=light]{--bg:#f4f5ff;--bg2:#e9ebff;--card:#ffffff;--card2:#eef0ff;--ink:#14163a;--mute:#4d5285;--line:#c6cbf3;--accent:#6a43f5;--a2:#007fa8;--a3:#d6247f;--a4:#4d7c0f;--a5:#b36b00;--ok:#13804f;--bad:#c62828;--shadow:0 6px 18px rgba(40,40,100,.14)}
[data-contrast=true][data-theme=dark]{--bg:#000;--bg2:#000;--card:#0a0a0a;--card2:#161616;--ink:#fff;--mute:#fff;--line:#fff;--accent:#b9a6ff;--a2:#4fe3ff;--ok:#5dffb0;--bad:#ff9a9a}
[data-contrast=true][data-theme=light]{--bg:#fff;--bg2:#fff;--card:#fff;--card2:#f2f2f2;--ink:#000;--mute:#000;--line:#000;--accent:#3a14c9;--a2:#00566f;--ok:#005a30;--bad:#9b0000}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent),radial-gradient(900px 500px at 100% 0,color-mix(in srgb,var(--a3) 14%,transparent),transparent),var(--bg);color:var(--ink);font:16px/1.5 var(--font);min-height:100vh}
h1,h2,h3{line-height:1.2;margin:.2em 0 .4em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--a2);outline-offset:2px;border-radius:6px}
.sr{position:absolute;left:-9999px}
#top{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:8px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#top .brand{font-weight:800;letter-spacing:.2px;margin-right:auto;white-space:nowrap;min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
#top .btn{padding:6px 10px;flex:0 0 auto}
@media(max-width:420px){#top{gap:5px;padding:8px}#top .brand{font-size:.85rem}}
#top .brand span{background:linear-gradient(90deg,var(--accent),var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{min-height:44px;min-width:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,background .2s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--a3));border-color:transparent;color:#fff}
.btn.good{background:var(--ok);color:#06210f;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:4px 10px;font-size:.9rem}
.btn.sel{outline:3px solid var(--a2)}
#top .btn .lbl{display:none}
@media(min-width:620px){#top .btn .lbl{display:inline}}
#view{max-width:1100px;margin:0 auto;padding:16px 14px 80px;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g-games{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.hero{padding:20px 4px 6px}
.hero h1{font-size:clamp(1.7rem,6vw,2.6rem);margin:0}
.hero p{color:var(--mute);margin:.3em 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:4px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:.9rem;white-space:nowrap}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.gcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:230px}
.gcard .art{position:absolute;inset:0 0 auto 0;height:96px;opacity:.95}
.gcard .emo{position:relative;font-size:2.6rem;margin-top:0;height:80px;display:flex;align-items:center}
.gcard h3{margin:.2em 0 0}
.gcard p{margin:0;color:var(--mute);font-size:.95rem;flex:1}
.g1 .art{background:linear-gradient(135deg,#5b21b6,#ec4899)}
.g2 .art{background:linear-gradient(135deg,#0e7490,#22d3ee 60%,#a3e635)}
.g3 .art{background:conic-gradient(from 200deg at 30% 60%,#f59e0b,#ef4444,#8b5cf6,#f59e0b)}
.g4 .art{background:repeating-linear-gradient(45deg,#1d4ed8 0 14px,#2563eb 14px 28px)}
.g5 .art{background:linear-gradient(135deg,#be123c,#f97316)}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.35),transparent 45%)}
.dots{display:inline-flex;gap:4px;align-items:center;font-size:.85rem;color:var(--mute)}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.on{background:var(--a5)}
.sect{margin:26px 0 10px;font-size:1.25rem}
table.stats{width:100%;border-collapse:collapse;font-size:.95rem}
table.stats th,table.stats td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
table.stats th{color:var(--mute);font-weight:600}
.ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.ach.locked{opacity:.55;filter:grayscale(.8)}
.ach .ic{font-size:1.8rem}
.ach small{color:var(--mute);display:block}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;color:#fff}
.badge.b1{background:#15803d}.badge.b2{background:#b45309}.badge.b3{background:#b91c1c}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.mute{color:var(--mute)}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.lv{min-height:52px;position:relative}
.lv small{position:absolute;top:2px;right:5px;font-size:.7rem}
.fb{min-height:1.6em;font-weight:600;margin:6px 0}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.timer{display:inline-flex;gap:4px;padding:4px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.expired{border-color:var(--a5)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;width:min(92vw,420px)}
.toast{background:var(--card2);border:1px solid var(--accent);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#modal .modal-back{position:fixed;inset:0;background:rgba(5,6,20,.7);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;overflow:auto}
.modal-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow);animation:pop .25s}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
.big-emo{font-size:3rem;text-align:center;animation:bounce .8s}
@keyframes bounce{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.field{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
select,input[type=text],input[type=number]{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px}
input[type=checkbox]{width:26px;height:26px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
/* Detective */
.suspect{cursor:pointer;text-align:left;display:block;width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.suspect.sel{border-color:var(--a3);background:color-mix(in srgb,var(--a3) 14%,var(--card))}
.suspect.out{opacity:.5}
.suspect .nm{font-weight:700}
.clue{border:1px dashed var(--line);border-radius:12px;padding:10px;background:var(--card)}
.clue.open{border-style:solid;border-color:var(--a2)}
.clue.pin{box-shadow:0 0 0 3px var(--a5)}
.tl{position:relative;height:26px;background:var(--card2);border-radius:8px;margin:4px 0}
.tl .win{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--bad) 35%,transparent);border-left:2px solid var(--bad);border-right:2px solid var(--bad)}
.tl .bar{position:absolute;top:5px;bottom:5px;border-radius:6px;background:var(--a2);opacity:.9}
.floor{display:flex;gap:4px;margin:8px 0}
.floor div{flex:1;text-align:center;padding:8px 2px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:.8rem}
.floor div.scene{border-color:var(--bad);font-weight:700}
/* Escape */
.inv{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.inv .item{background:var(--card2);border:1px solid var(--a5);border-radius:10px;padding:4px 10px}
.dials{display:flex;gap:10px;justify-content:center;margin:12px 0}
.dial{display:flex;flex-direction:column;align-items:center;gap:4px}
.dial .v{width:56px;height:62px;border-radius:12px;background:#000;color:#7dffb0;font:700 2rem monospace;display:flex;align-items:center;justify-content:center;border:2px solid var(--line)}
.sw-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.sw{width:64px;height:92px;border-radius:14px;border:2px solid var(--line);background:var(--card2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0;font-weight:700}
.sw .lev{width:18px;height:40px;border-radius:9px;background:var(--mute);transition:transform .2s}
.sw[aria-pressed=true]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card2))}
.sw[aria-pressed=true] .lev{background:var(--ok);transform:translateY(-6px)}
.sw[aria-pressed=false] .lev{transform:translateY(6px)}
.ring{position:relative;width:260px;height:260px;margin:10px auto}
.ring .sym{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;font-size:1.6rem;border-radius:50%}
.seq{display:flex;gap:8px;justify-content:center;min-height:48px;font-size:1.8rem}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{min-width:56px;height:56px;border-radius:12px;background:var(--card2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 1.3rem monospace;padding:0 8px}
.shelves{display:grid;gap:8px;margin:8px 0}
.shelf{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card2)}
.shelf b{min-width:70px}
.wheel{font:600 1.1rem monospace;text-align:center;overflow-x:auto;white-space:nowrap;padding:6px}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.keypad .btn{height:56px;font-size:1.3rem}
.disp{font:700 1.8rem monospace;letter-spacing:6px;text-align:center;background:#000;color:#7dffb0;border-radius:10px;padding:8px;min-height:52px;margin:8px auto;max-width:320px}
/* Shape */
.play{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:800px){.play.two{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.board{width:100%;max-width:520px;margin:0 auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.board .cellbg{fill:var(--card2);stroke:var(--line);stroke-width:1}
.board .cellbg:focus{outline:none;stroke:var(--a2);stroke-width:3}
.tray{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.pc{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:6px;cursor:grab;touch-action:none;min-width:56px;min-height:56px;display:flex;align-items:center;justify-content:center}
.pc.sel{border-color:var(--a2);box-shadow:0 0 0 3px color-mix(in srgb,var(--a2) 40%,transparent)}
.pc.used{opacity:.35}
.ghost-drag{position:fixed;pointer-events:none;z-index:70;opacity:.85;transform:translate(-50%,-50%)}
.symgrid{display:grid;gap:3px;margin:0 auto;max-width:420px;position:relative}
.sc{aspect-ratio:1;border-radius:8px;border:2px solid var(--line);background:var(--card2);cursor:pointer;padding:0;min-height:32px}
.sc.lock{cursor:default;border-color:var(--mute)}
.sc.c1{background:var(--a2)}.sc.c2{background:var(--a3)}.sc.c3{background:var(--a5)}
.sc.err{outline:3px solid var(--bad)}
.sc.axisR{border-right:4px dashed var(--a5)}.sc.axisB{border-bottom:4px dashed var(--a5)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.opt{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;min-height:90px;display:flex;align-items:center;justify-content:center}
.opt:hover{border-color:var(--a2)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.winpulse{animation:bounce .6s}
/* Logic */
.lever{min-height:92px;width:100%;border-radius:14px;border:2px solid var(--line);background:var(--card2);cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;padding:8px}
.lever .lamp{font-size:1.8rem}
.lever.flash{border-color:var(--a5);box-shadow:0 0 0 3px color-mix(in srgb,var(--a5) 40%,transparent)}
.lever.locked{opacity:.65;border-style:dashed}
.lever.hint{outline:3px solid var(--a4)}
.log{max-height:150px;overflow:auto;font-size:.9rem;color:var(--mute);padding-left:18px;margin:6px 0}
.wire{stroke:var(--line);stroke-width:3;fill:none}
.wire.on{stroke:var(--a4)}
.gate{fill:var(--card2);stroke:var(--accent);stroke-width:2}
.svgtxt{fill:var(--ink);font:600 12px var(--font);text-anchor:middle;dominant-baseline:middle}
/* Battle */
.bq{font-size:1.25rem;font-weight:700;margin:8px 0}
.bopts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bopts .btn{min-height:58px;font-size:1.1rem}
.score{display:flex;gap:10px;justify-content:space-around;text-align:center}
.score .p{flex:1;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.score .p.turn{border-color:var(--a2);box-shadow:0 0 0 3px color-mix(in srgb,var(--a2) 35%,transparent)}
.oddgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:360px;margin:8px auto}
.oddgrid .btn{font-size:1.6rem;min-height:56px;padding:0}
[data-motion=reduce] *,[data-motion=reduce] *::before,[data-motion=reduce] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){[data-motion=auto] *,[data-motion=auto] *::before,[data-motion=auto] *::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="sr" href="#view">Skip to content</a>
<header id="top">
  <div class="brand">🧠 <span>BrainPlay Arena</span></div>
  <button class="btn" id="nb-help" aria-label="How to play">❓<span class="lbl">Help</span></button>
  <button class="btn" id="nb-home" aria-label="Home">🏠<span class="lbl">Home</span></button>
  <button class="btn" id="nb-back" aria-label="Back">◀<span class="lbl">Back</span></button>
  <button class="btn" id="nb-restart" aria-label="Restart">↻<span class="lbl">Restart</span></button>
  <button class="btn primary" id="nb-next" aria-label="Next level"><span class="lbl">Next</span>▶</button>
</header>
<main id="view" tabindex="-1"></main>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal" hidden></div>
<noscript>BrainPlay Arena needs JavaScript enabled.</noscript>
<script>
'use strict';
/* ===== BrainPlay Arena — core: utils, storage, scoring, achievements, navigation, home ===== */
const BPA={games:{},ctx:{daily:null},version:'1.0.0'};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.slice(0,2)==='on'&&typeof v==='function')e.addEventListener(k.slice(2).toLowerCase(),v);else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else e.setAttribute(k,v===true?'':v);}
  for(const kid of kids.flat(3)){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(String(kid)));}return e;}
const SVGNS='http://www.w3.org/2000/svg';
function sv(tag,attrs,...kids){const e=document.createElementNS(SVGNS,tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k.slice(0,2)==='on'&&typeof v==='function')e.addEventListener(k.slice(2).toLowerCase(),v);else e.setAttribute(k,v===true?'':v);}
  for(const kid of kids.flat(3)){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(String(kid)));}return e;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function Rng(seed){const r=mulberry(seed>>>0);return{next:r,int:(a,b)=>a+Math.floor(r()*(b-a+1)),pick:a=>a[Math.floor(r()*a.length)],chance:p=>r()<p,
  shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}};}
function hashStr(s){let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619);}return x>>>0;}
const newSeed=()=>(Math.random()*4294967296)>>>0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleepless=fn=>setTimeout(fn,0);

/* ---------- storage ---------- */
const STORE_KEY='brainplay.arena.v1';
function defaults(){return{v:1,settings:{theme:'dark',contrast:false,motion:'auto',mode:'relaxed',unlockAll:false},games:{},ach:{},daily:{last:null,streak:0,best:0,total:0},history:[],seen:{},points:0,perfect:0,last:null,progress:{},names:['Player 1','Player 2']};}
function merge(d,o){if(o&&typeof o==='object'&&!Array.isArray(o)){for(const k in o){if(k==='__proto__'||k==='constructor')continue;if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k])&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))merge(d[k],o[k]);else d[k]=o[k];}}return d;}
let S;let storageOK=true;
function load(){try{const raw=localStorage.getItem(STORE_KEY);if(raw){const o=JSON.parse(raw);S=merge(defaults(),o);S.v=1;return;}}catch(e){storageOK=false;}S=defaults();}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){storageOK=false;}}
function G(id){return S.games[id]||(S.games[id]={plays:0,solved:0,attempts:0,correct:0,points:0,best:0,done:{},bestBy:{},hints:0,perfect:0});}
function applySettings(){const r=document.documentElement;r.dataset.theme=S.settings.theme==='light'?'light':'dark';r.dataset.contrast=String(!!S.settings.contrast);r.dataset.motion=['auto','reduce','full'].includes(S.settings.motion)?S.settings.motion:'auto';}
const isChallenge=()=>S.settings.mode==='challenge';

/* ---------- UI helpers ---------- */
function toast(msg){const t=h('div',{class:'toast'},msg);$('#toasts').append(t);setTimeout(()=>t.remove(),3200);}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';if(BPA._lastFocus&&BPA._lastFocus.focus)try{BPA._lastFocus.focus({preventScroll:true});}catch(e){}}
function modal(title,body,buttons){BPA._lastFocus=document.activeElement;const root=$('#modal');root.innerHTML='';

const mm=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const CASES=[];for(let i=0;i<30;i++){const f=Math.floor(i/5),k=i%5;CASES.push({id:'case-'+(i+1),num:i+1,flavor:f,kind:k,diff:f<2?1:f<4?2:3,title:TITLES[f][k]});}

function pickSuspects(rng,n){return rng.shuffle(PEOPLE).slice(0,n).map(p=>({name:p[0],emoji:p[1]}));}
const listNames=(sus,idxs)=>idxs.map(i=>sus[i].name).join(', ');

/* ---- Kind 0: alibi timeline ---- */
function genAlibi(rng,fl,diff){const n=diff+3;const sus=pickSuspects(rng,n);const culprit=rng.int(0,n-1);
  const len=[0,20,25,30][diff];let a=rng.int(19*60,21*60+30);a-=a%5;const b=a+len;const clues=[],timeline=[];let id=0;
  const places=rng.shuffle(fl.places);
  const rec=(who,place,from,to,key)=>{const src=rng.pick(SOURCES);const c={id:'k'+(id++),title:src+' — '+sus[who].name,text:src+' places '+sus[who].name+' at the '+place+' from '+mm(from)+' to '+mm(to)+'.',key:!!key,suspect:who};clues.push(c);timeline.push({who,from,to,place});return c;};
  const sayings=[];
  sus.forEach((s,i)=>{const place=places[i%places.length];
    if(i===culprit){const g1=a+rng.int(2,Math.max(3,len-10));const g2=Math.min(b,g1+rng.int(6,8));
      rec(i,place,a-rng.int(10,25),g1,true);rec(i,place,g2,b+rng.int(8,20),true);s.cleared=null;s.gap=[g1,g2];s.claim=place;s.statement='"I was in the '+place+' all evening — ask anyone."';}
    else{const lie=diff>1&&rng.chance(.45);const real=place;
      if(diff===1){rec(i,real,a-rng.int(5,15),b+rng.int(5,15));}
      else{const m=a+rng.int(6,len-6);rec(i,real,a-rng.int(5,12),m+3);rec(i,real,m-3,b+rng.int(4,12));}
      if(lie){const fake=places[(i+3)%places.length]===real?'Cloakroom':places[(i+3)%places.length];s.statement='"I was in the '+fake+' all evening."';s.liar=true;}else s.statement='"I was in the '+real+' all evening."';
      s.cleared=sus[i].name+' is covered for the whole window ('+mm(a)+'–'+mm(b)+') by the records at the '+real+'.'+(s.liar?' (Their own statement was wrong — they lied about where they were — but the records still clear them.)':'');}
  });
  const order=rng.shuffle(clues);
  const exp='The '+fl.item+' '+fl.crime.replace('vanished','vanished').replace(/^/,'')+' between '+mm(a)+' and '+mm(b)+'. '+sus.filter((_,i)=>i!==culprit).map(s=>s.name).join(', ')+' each have records covering that entire window, so none could have been at the '+fl.scene+'. Only '+sus[culprit].name+' has a gap, from '+mm(sus[culprit].gap[0])+' to '+mm(sus[culprit].gap[1])+', in which nobody can account for them — and their statement claims they never left the '+sus[culprit].claim+'.';
  const verify=()=>sus.filter((_,i)=>{for(let t=a;t<b;t++){if(!timeline.some(r=>r.who===i&&r.from<=t&&t<r.to))return true;}return false;}).length;
  return{verify,suspects:sus,clues:order,answer:culprit,explanation:exp,window:[a,b],timeline,
    story:fl.item[0].toUpperCase()+fl.item.slice(1)+' '+fl.crime+' at some point between '+mm(a)+' and '+mm(b)+'. Cross-check every record against that window.',
    hints:['Only the crime window ('+mm(a)+'–'+mm(b)+') matters. For each suspect ask: do the records cover all of it?','Combine the records for each person — look for someone whose records leave a gap inside the window.','Eliminate one innocent: '+(sus.find((s,i)=>i!==culprit).cleared)]};}

/* ---- Kind 1: who is lying (culprit lies, others truthful) ---- */
function genLiar(rng,fl,diff){const n=diff+3;const sus=pickSuspects(rng,n);
  const truth=(st,c)=>st.t==='is'?c===st.p:st.t==='not'?c!==st.p:(c===st.p||c===st.q);
  let sts,cands;for(let tries=0;tries<2000;tries++){sts=sus.map((_,i)=>{const t=rng.pick(diff===1?['is','not','either']:['is','not','either','is','not']);let p=rng.int(0,n-1),q=rng.int(0,n-1);
      if(t==='is'||t==='either'){if(p===i)p=(p+1)%n;}if(t==='either'){while(q===p||q===i)q=rng.int(0,n-1);}return{t,p,q,who:i};});
    cands=[];for(let c=0;c<n;c++){let ok=true;for(let i=0;i<n;i++){const tv=truth(sts[i],c);if(i===c?tv:!tv){ok=false;break;}}if(ok)cands.push(c);}
    if(cands.length===1)break;}
  if(cands.length!==1)return genLiar(Rng(rng.int(1,1e9)),fl,diff);
  const culprit=cands[0];const nm=i=>sus[i].name;
  sus.forEach((s,i)=>{const st=sts[i];let txt;
    if(st.t==='is')txt=(diff>1&&rng.chance(.5))?nm(st.p)+' is the one lying.':'It was '+nm(st.p)+'.';
    else if(st.t==='not')txt=(diff>1&&rng.chance(.5))?(st.p===i?'I am telling the truth.':nm(st.p)+' is telling the truth.'):(st.p===i?'It was not me.':'It was not '+nm(st.p)+'.');
    else txt='It was either '+nm(st.p)+' or '+nm(st.q)+'.';
    st.txt=txt;s.statement='"'+txt+'"';});
  // elimination reasons
  const why={};const eliminators=new Set();
  for(let c=0;c<n;c++){if(c===culprit)continue;let r=null;for(let i=0;i<n&&!r;i++){const tv=truth(sts[i],c);if(i!==c&&!tv){r='If '+nm(c)+' were guilty, '+nm(i)+'\'s statement ("'+sts[i].txt+'") would be false — but only the culprit lies.';eliminators.add(i);}else if(i===c&&tv){r='If '+nm(c)+' were guilty, their own statement ("'+sts[i].txt+'") would be true — but the culprit\'s statement is false.';eliminators.add(i);}}why[c]=r;}
  eliminators.add(culprit);
  const clues=sus.map((s,i)=>({id:'k'+i,title:'Statement — '+s.name,text:nm(i)+' says: "'+sts[i].txt+'"',key:eliminators.has(i),suspect:i}));
  clues.unshift({id:'rule',title:'The Rule (from the investigator)',text:'Everyone except the guilty person is telling the truth. The guilty person\'s statement is false.',key:true});
  sus.forEach((s,i)=>s.cleared=i===culprit?null:why[i]);
  const exp='Test each suspect as the culprit. '+sus.filter((_,i)=>i!==culprit).map((s,i2)=>'• '+s.cleared).join(' ')+' Only with '+nm(culprit)+' guilty is exactly one statement false — their own.';
  const verify=()=>{let c=0;for(let x=0;x<n;x++){let ok=true;for(let i=0;i<n;i++){const tv=truth(sts[i],x);if(i===x?tv:!tv){ok=false;break;}}if(ok)c++;}return c;};
  return{verify,suspects:sus,clues,answer:culprit,explanation:exp,story:'Everyone was questioned about who took '+fl.item+'. Remember the investigator\'s rule — then test each suspect.',
    hints:['Assume one suspect is guilty and check every statement against the rule.','Count how many statements would be false under each assumption — the rule allows exactly one (the culprit\'s).','Eliminate one: '+sus.find((s,i)=>i!==culprit).cleared]};}

/* ---- Kind 2: trait matching ---- */
const TRAITS=[['Shoes',['sneakers','boots','sandals'],['👟','🥾','🩴']],['Handed',['left-handed','right-handed','ambidextrous'],['🫲','🫱','🙌']],['Wears',['a cap','a scarf','glasses'],['🧢','🧣','👓']],['Carries',['a coffee','a backpack','an umbrella'],['☕','🎒','☂️']]];
function genTraits(rng,fl,diff){const n=diff+3;const sus=pickSuspects(rng,n);let prof,culprit,reveal;
  for(let t=0;t<5000;t++){prof=[];const seen=new Set();let okp=true;for(let i=0;i<n;i++){let p;let g=0;do{p=TRAITS.map(()=>rng.int(0,2));g++;}while(seen.has(p.join())&&g<50);seen.add(p.join());prof.push(p);}
    culprit=rng.int(0,n-1);const order=rng.shuffle([0,1,2,3]);reveal=[];
    for(const tr of order){reveal.push(tr);const left=prof.map((p,i)=>i).filter(i=>reveal.every(r=>prof[i][r]===prof[culprit][r]));if(left.length===1)break;}
    const left=prof.map((p,i)=>i).filter(i=>reveal.every(r=>prof[i][r]===prof[culprit][r]));
    if(left.length===1&&reveal.length>=(diff===1?2:3))break;}
  sus.forEach((s,i)=>{s.statement=TRAITS.map((T,ti)=>T[2][prof[i][ti]]+' '+T[0]+': '+T[1][prof[i][ti]]).join(' • ');});
  const clueText=[(r)=>'Footprints at the '+fl.scene+' were made by '+TRAITS[0][1][prof[culprit][0]]+'.',(r)=>'The cut mark on the case shows the thief was '+TRAITS[1][1][prof[culprit][1]]+'.',(r)=>'A fibre snagged on the door matches '+TRAITS[2][1][prof[culprit][2]]+'.',(r)=>'A witness saw the thief carrying '+TRAITS[3][1][prof[culprit][3]]+'.'];
  const clues=reveal.map((r,i)=>({id:'k'+i,title:['Footprints','Cut mark','Fibre','Witness'][r],text:clueText[r](),key:true}));
  // add a true-but-already-implied flavour clue (not key)
  sus.forEach((s,i)=>{if(i===culprit){s.cleared=null;return;}const r=reveal.find(r=>prof[i][r]!==prof[culprit][r]);s.cleared=s.name+' is '+TRAITS[r][1][prof[i][r]]+' (trait: '+TRAITS[r][0].toLowerCase()+'), but the evidence points to '+TRAITS[r][1][prof[culprit][r]]+'.';});
  const exp='Each clue removes suspects whose dossier does not match. '+sus.filter((_,i)=>i!==culprit).map(s=>s.cleared).join(' ')+' Only '+sus[culprit].name+' matches every clue.';
  const verify=()=>prof.filter(p=>reveal.every(r=>p[r]===prof[culprit][r])).length;
  return{verify,suspects:sus,clues,answer:culprit,explanation:exp,story:'Compare the evidence from the scene with each suspect\'s dossier. Inspect every card.',
    hints:['Match each evidence clue against the dossiers; cross out anyone who does not fit.','Start with the clue that eliminates the most suspects, then combine with the others.','Eliminate one: '+sus.find((s,i)=>i!==culprit).cleared]};}

/* ---- Kind 3: access chain ---- */
function genAccess(rng,fl,diff){const n=diff+3;const sus=pickSuspects(rng,n);const culprit=rng.int(0,n-1);const gcount=diff+2;const gates=rng.shuffle(fl.gates).slice(0,gcount);
  let I=sus.map((_,i)=>i);const sets=[];
  for(let k=0;k<gcount;k++){let S;const others=sus.map((_,i)=>i).filter(i=>i!==culprit);
    if(k===gcount-1){const outside=others.filter(i=>!I.includes(i));const insideOthers=others.filter(i=>I.includes(i));const extra=rng.shuffle(outside).slice(0,rng.int(1,Math.max(1,outside.length)));S=[culprit].concat(extra);if(!extra.length&&insideOthers.length&&rng.chance(.5))S=[culprit];}
    else{const m=rng.int(1,Math.max(1,Math.min(n-2,others.length-1)));S=[culprit].concat(rng.shuffle(others).slice(0,m));}
    sets.push(S);I=I.filter(i=>S.includes(i));}
  // guarantee uniqueness
  if(I.length!==1||I[0]!==culprit){sets[gcount-1]=[culprit];I=[culprit];}
  const clues=sets.map((S,k)=>({id:'k'+k,title:'Step '+(k+1)+' — '+gates[k][0],text:'To take '+fl.item+' the thief had to get through the '+gates[k][0].toLowerCase()+(k?' (only after step '+k+')':'')+'. '+gates[k][1]+': '+listNames(sus,S.slice().sort((x,y)=>x-y))+'.',key:true}));
  sus.forEach((s,i)=>{if(i===culprit){s.cleared=null;s.statement='Says: "I was nowhere near the '+fl.scene+'."';return;}const k=sets.findIndex(S=>!S.includes(i));s.cleared=s.name+' is not on the list for step '+(k+1)+' ('+gates[k][0]+'), so could not have completed the chain.';s.statement='Says: "I never touched anything at the '+fl.scene+'."';});
  const exp='Each step in the chain depends on the one before it, so the thief must appear on every list. '+sus.filter((_,i)=>i!==culprit).map(s=>s.cleared).join(' ')+' Only '+sus[culprit].name+' appears on all '+gcount+' lists.';
  const verify=()=>sus.filter((_,i)=>sets.every(S=>S.includes(i))).length;
  return{verify,suspects:sus,clues,answer:culprit,explanation:exp,story:'The theft needed several steps in order — each one possible only for certain people. Who could do them all?',
    hints:['The thief must have been able to do EVERY step. Look for names that appear in all lists.','Write down who is on step 1, then keep only those who also appear on step 2, and so on.','Eliminate one: '+sus.find((s,i)=>i!==culprit).cleared]};}

/* ---- Kind 4: corridor logic ---- */
function genCorridor(rng,fl,diff){const n=diff+3;const sus=pickSuspects(rng,n);const rooms=rng.shuffle(fl.places.filter(p=>p!==fl.scene)).slice(0,n-1);const sceneIdx=rng.int(0,n-1);rooms.splice(sceneIdx,0,fl.scene);
  const planted=rng.shuffle([...Array(n).keys()]); // planted[person]=room position
  const perms=[];(function perm(a,k){if(k===a.length){perms.push(a.slice());return;}for(let i=k;i<a.length;i++){[a[k],a[i]]=[a[i],a[k]];perm(a,k+1);[a[k],a[i]]=[a[i],a[k]];}})([...Array(n).keys()],0);
  const nm=i=>sus[i].name;
  const mk=()=>{const p=rng.int(0,n-1);let q=rng.int(0,n-1);while(q===p)q=rng.int(0,n-1);const r=rng.int(0,n-1);const t=rng.int(0,4);
    if(t===0)return{t:'in',p,r:planted[p],f:a=>a[p]===planted[p],txt:nm(p)+' was seen in the '+rooms[planted[p]]+'.'};
    if(t===1){const rr=(r===planted[p])?(r+1)%n:r;return{t:'notin',p,r:rr,f:a=>a[p]!==rr,txt:nm(p)+' was definitely not in the '+rooms[rr]+'.'};}
    if(t===2){if(Math.abs(planted[p]-planted[q])!==1)return null;return{t:'adj',p,q,f:a=>Math.abs(a[p]-a[q])===1,txt:nm(p)+' and '+nm(q)+' were in neighbouring rooms.'};}
    if(t===3){if(planted[p]>=planted[q])return null;return{t:'left',p,q,f:a=>a[p]<a[q],txt:nm(p)+' was in a room further left than '+nm(q)+'.'};}
    if(Math.abs(planted[p]-planted[q])===1)return null;return{t:'nadj',p,q,f:a=>Math.abs(a[p]-a[q])!==1,txt:nm(p)+' and '+nm(q)+' were NOT in neighbouring rooms.'};};
  const occ=cl=>{const ps=perms.filter(a=>cl.every(c=>c.f(a)));const set=new Set(ps.map(a=>a.indexOf(sceneIdx)));return{ps,set};};
  let cl=[];for(let g=0;g<400;g++){const c=mk();if(!c)continue;cl.push(c);if(occ(cl).set.size===1)break;}
  if(occ(cl).set.size!==1)return genCorridor(Rng(rng.int(1,1e9)),fl,diff);
  for(let i=cl.length-1;i>=0;i--){const t=cl.slice();t.splice(i,1);if(occ(t).set.size===1)cl=t;}
  const info=occ(cl);const culprit=[...info.set][0];
  const clues=cl.map((c,i)=>({id:'k'+i,title:'Witness report '+(i+1),text:c.txt,key:true}));
  sus.forEach((s,i)=>{s.statement=i===culprit?'Says: "I was just walking the corridor."':'Says: "I was in one of the rooms, honestly."';s.cleared=null;});
  const ex=info.ps[0];
  sus.forEach((s,i)=>{if(i!==culprit)s.cleared=s.name+' cannot be in the '+fl.scene+': '+(info.ps.length===1?'the only room layout that fits':'every one of the '+info.ps.length+' room layouts that fit')+' all reports puts '+sus[culprit].name+' there.';});
  const exp='Try every way of placing the suspects in the '+n+' rooms and keep only layouts that obey all reports. '+(info.ps.length===1?'Exactly one layout fits':info.ps.length+' layouts fit')+', and in all of them '+sus[culprit].name+' is in the '+fl.scene+'. Example layout (left to right): '+rooms.map((r,pos)=>r+' → '+sus[ex.indexOf(pos)].name).join('; ')+'.';
  let fixed=null;for(let i=0;i<n;i++){if(i!==culprit&&info.ps.every(a=>a[i]===info.ps[0][i])){fixed=i;break;}}
  const verify=()=>occ(cl).set.size;
  return{verify,suspects:sus,clues,answer:culprit,explanation:exp,rooms,sceneIdx,story:'Everyone was in a different room along one corridor when '+fl.item+' '+fl.crime.replace(/^(vanished|was taken|was stolen|went missing|disappeared|was stolen) from/,'went missing from')+'. Who was in the '+fl.scene+'? Use the witness reports.',
    hints:['Draw the corridor and try placing suspects in rooms; each report rules some placements out.','Start with reports that name an exact room, then use the "neighbouring" and "left of" reports.',fixed!=null?'In every valid layout, '+sus[fixed].name+' is in the '+rooms[info.ps[0][fixed]]+'. Use that to place others.':'There are '+info.ps.length+' layout(s) that fit — every one has the same person in the '+fl.scene+'.']};}
const GEN=[genAlibi,genLiar,genTraits,genAccess,genCorridor];
function buildCase(c,seed){const rng=Rng(seed);const fl=FLAVORS[c.flavor];const d=GEN[c.kind](rng,fl,c.diff);return Object.assign(d,{c,fl,seed});}
BPA.detectiveGen=buildCase;BPA.detectiveCases=CASES;

function start(c,seed,daily,resume){seed=seed||newSeed();BPA.ctx.daily=daily?daily:null;if(!resume)Score.play('detective');
  const d=buildCase(c,seed);st.cur={d,c,seed,inspected:new Set(),pinned:new Set(),hints:0,wrong:0,selected:null,revealed:false,done:false,eliminated:new Set()};

const WORDS=['planet','garden','rocket','pencil','castle','bridge','jungle','mirror','window','silver','dragon','forest','island','guitar','puzzle','thunder','whisper','monkey','pirate','magnet'];
const SETS=[['Apple','Mango','Grape','Peach','Lemon'],['Tiger','Zebra','Eagle','Whale','Panda'],['Mars','Venus','Saturn','Neptune','Mercury'],['Piano','Violin','Drums','Flute','Guitar'],['Chess','Ludo','Poker','Carrom','Bingo'],['Paris','Cairo','Tokyo','Lima','Delhi']];
const SETN=['fruits','animals','planets','instruments','games','cities'];
const PAIRS=[['🔵','🟣'],['🕐','🕑'],['🟥','🟧'],['🌑','🌒'],['😀','😃'],['⬛','🔲'],['🔺','🔻'],['🟢','🟩']];
const NAMES3=['Asha','Ben','Chloe','Dev','Elena','Farid','Gia','Hugo'];
function opts(rng,ans,pool){const s=new Set([String(ans)]);const o=[String(ans)];for(const x of pool){if(!s.has(String(x))&&o.length<4){s.add(String(x));o.push(String(x));}}let k=1;while(o.length<4){const x=ans+k*(k%2?1:-1)*rng.int(1,3);k++;if(!s.has(String(x))){s.add(String(x));o.push(String(x));}}const sh=rng.shuffle(o);return{options:sh,answer:sh.indexOf(String(ans))};}
function qPattern(rng){const t=rng.int(0,4);let seq=[],rule='';const a=rng.int(1,9);
  if(t===0){const d=rng.int(2,7);for(let i=0;i<6;i++)seq.push(a+d*i);rule='add '+d+' each step';}
  else if(t===1){const r=rng.int(2,3);for(let i=0;i<6;i++)seq.push(a*Math.pow(r,i));rule='multiply by '+r+' each step';}
  else if(t===2){for(let i=0;i<6;i++)seq.push((a+i)*(a+i));rule='square numbers ('+a+'², '+(a+1)+'², …)';}
  else if(t===3){let d=rng.int(1,3);seq=[a];for(let i=1;i<6;i++){seq.push(seq[i-1]+d);d++;}rule='the step grows by 1 each time';}
  else{const b=rng.int(1,5);seq=[a,b];for(let i=2;i<6;i++)seq.push(seq[i-1]+seq[i-2]);rule='each number is the sum of the two before';}
  const ans=seq[5];const o=opts(rng,ans,[ans+1,ans-1,ans+2,ans-2,seq[4]+seq[4]-seq[3]]);
  return{kind:'choice',prompt:'What comes next?  '+seq.slice(0,5).join(', ')+', ?',options:o.options,answer:o.answer,explain:'Rule: '+rule+' → '+ans+'.'};}
function qLogic(rng){const n=rng.int(3,4);const ppl=rng.shuffle(NAMES3).slice(0,n);const rel=rng.pick([['taller','shorter','tallest','shortest'],['faster','slower','fastest','slowest'],['older','younger','oldest','youngest']]);
  const order=ppl.slice();// order[0] is greatest
  const stmts=[];for(let i=0;i<n-1;i++){stmts.push(rng.chance(.5)?order[i]+' is '+rel[0]+' than '+order[i+1]+'.':order[i+1]+' is '+rel[1]+' than '+order[i]+'.');}
  const q=rng.int(0,2);let ans,text;if(q===0){ans=order[0];text='Who is the '+rel[2]+'?';}else if(q===1){ans=order[n-1];text='Who is the '+rel[3]+'?';}else{ans=order[1];text='Who is second '+(rng.chance(.5)?'':'')+rel[2]+'?';}
  const sh=rng.shuffle(order);return{kind:'choice',prompt:rng.shuffle(stmts).join(' ')+'  '+text,options:sh,answer:sh.indexOf(ans),explain:'Chain them: '+order.join(' > ')+' (greatest to least) → '+ans+'.'};}
function scramble(rng,w){let s;do{s=rng.shuffle(w.split('')).join('');}while(s===w);return s;}
function qWord(rng){if(rng.chance(.55)){const w=rng.pick(WORDS);const others=rng.shuffle(WORDS.filter(x=>x!==w)).slice(0,3);const sh=rng.shuffle([w].concat(others));return{kind:'choice',prompt:'Unscramble the letters:  '+scramble(rng,w).toUpperCase(),options:sh.map(x=>x.toUpperCase()),answer:sh.indexOf(w),explain:'The letters spell '+w.toUpperCase()+'.'};}
  const si=rng.int(0,SETS.length-1);let sj=rng.int(0,SETS.length-1);while(sj===si)sj=rng.int(0,SETS.length-1);const three=rng.shuffle(SETS[si]).slice(0,3);const odd=rng.pick(SETS[sj]);const all=rng.shuffle(three.concat([odd]));
  return{kind:'choice',prompt:'Which word does not belong with the others?',options:all,answer:all.indexOf(odd),explain:three.join(', ')+' are '+SETN[si]+'; '+odd+' is one of the '+SETN[sj]+'.'};}
function qMath(rng){const t=rng.int(0,2);let txt,ans,wrong;const a=rng.int(2,12),b=rng.int(2,9),c=rng.int(2,9),d=rng.int(1,15);
  if(t===0){txt=a+' + '+b+' × '+c;ans=a+b*c;wrong=[(a+b)*c];}else if(t===1){txt='('+a+' + '+b+') × '+c+' − '+d;ans=(a+b)*c-d;wrong=[a+b*c-d];}else{txt=a+' × '+b+' − '+c+' × 2';ans=a*b-c*2;wrong=[(a*b-c)*2];}
  const o=opts(rng,ans,wrong.concat([ans+10,ans-10,ans+1,ans-1]));return{kind:'choice',prompt:'Calculate:  '+txt,options:o.options,answer:o.answer,explain:txt+' = '+ans+' (multiplication before addition/subtraction).'};}
function qVisual(rng){if(rng.chance(.5)){const p=rng.pick(PAIRS);const idx=rng.int(0,24);const cells=Array(25).fill(p[0]);cells[idx]=p[1];return{kind:'grid',prompt:'Tap the tile that is different from all the others.',cells,answer:idx,explain:'Only one tile is '+p[1]+'; the rest are '+p[0]+'.'};}
  const set=['🔺','🟦','⭐'];const cells=[];for(let i=0;i<20;i++)cells.push(rng.pick(set));const tgt=rng.pick(set);const cnt=cells.filter(x=>x===tgt).length;const o=opts(rng,cnt,[cnt+1,cnt-1,cnt+2,cnt-2]);
  return{kind:'choice',prompt:'How many '+tgt+' are in the picture?',display:cells,options:o.options,answer:o.answer,explain:'There are '+cnt+' of '+tgt+'.'};}
const QG={pattern:qPattern,logic:qLogic,word:qWord,math:qMath,visual:qVisual};
BPA.battleGen=(cat,seed)=>QG[cat](Rng(seed));
const st={m:null,setup:{N:3,timer:false}};

function setup(){BPA.ctx.daily=null;st.m=null;const n1=h('input',{type:'text',id:'bt-n1',maxlength:14,'aria-label':'Player 1 name',value:S.names[0]}),n2=h('input',{type:'text',id:'bt-n2',maxlength:14,'aria-label':'Player 2 name',value:S.names[1]});
  const ns=h('select',{id:'bt-n','aria-label':'Match length'},[3,5].map(v=>{const o=h('option',{value:v},'Best of '+v);if(st.setup.N===v)o.selected=true;return o;}));const tm=h('input',{type:'checkbox',id:'bt-timer','aria-label':'Use question timers'});tm.checked=st.setup.timer;
  const hist=S.history.slice(0,6);
  show(h('div',null,h('h1',null,'⚔️ Brain Battle'),h('p',{class:'mute'},'Two players, one device. Each round has two questions in one category. Both players answer the same questions — alternating who goes first — and answers stay hidden until both are done. Most correct answers wins the round.'),
    h('div',{class:'card'},h('div',{class:'field'},h('label',{for:'bt-n1'},'Player 1'),n1),h('div',{class:'field'},h('label',{for:'bt-n2'},'Player 2'),n2),h('div',{class:'field'},h('label',{for:'bt-n'},'Match length'),ns),
      h('div',{class:'field'},h('div',null,h('b',null,'Question timers (20 s)'),h('div',{class:'mute'},'Off by default. If time runs out, that question counts as unanswered.')),tm),
      h('button',{class:'btn primary',id:'bt-start',style:{marginTop:'12px'},onClick:()=>{S.names=[(n1.value.trim()||'Player 1').slice(0,14),(n2.value.trim()||'Player 2').slice(0,14)];if(S.names[0]===S.names[1])S.names[1]+=' 2';st.setup.N=+ns.value;st.setup.timer=tm.checked;save();startMatch();}},'▶ Start match')),
    h('h2',{class:'sect'},'📜 Recent matches'),hist.length?h('div',{class:'card'},h('table',{class:'stats'},h('tbody',null,hist.map(x=>h('tr',null,h('td',null,new Date(x.t).toLocaleDateString()),h('td',null,x.names[0]+' '+x.wins[0]+' – '+x.wins[1]+' '+x.names[1]),h('td',null,x.winner<0?'Draw':'🏆 '+x.names[x.winner]),h('td',null,'Bo'+x.N)))))):h('p',{class:'mute'},'No matches yet — play one!')),{back:BPA.home});}
function startMatch(){Score.play('battle');const N=st.setup.N;const cats=Rng(newSeed()).shuffle(CATS.map(c=>c.id));st.m={names:S.names.slice(),N,rtw:Math.ceil(N/2),wins:[0,0],draws:0,round:0,cats,rounds:[],timer:st.setup.timer,cur:null,done:false};BPA.setLast('battle','Match in setup');S.progress.battle=null;nextRound();}
function nextRound(){const m=st.m;const catId=m.cats[m.round%5];const rng=Rng(newSeed());const cat=CATS.find(c=>c.id===catId);const qs=[QG[catId](rng),QG[catId](rng)];
  m.cur={cat,qs,ans:[[null,null],[null,null]],order:m.round%2===0?[0,1]:[1,0],step:0,qi:0};handoff();}
const score=m=>h('div',{class:'score'},[0,1].map(p=>h('div',{class:'p'+(m.cur&&m.cur.order[m.cur.step]===p&&m.phase==='q'?' turn':'')},h('div',{class:'mute'},m.names[p]),h('div',{style:{fontSize:'2rem',fontWeight:800}},m.wins[p]),h('div',{class:'mute'},'rounds won'))));
function navs(extra){return Object.assign({back:()=>BPA.confirm('Leave this match? Its progress will be lost.',setup),restart:()=>BPA.confirm('Restart the match from round 1?',()=>startMatch())},extra||{});}
function handoff(){const m=st.m,c=m.cur;m.phase='h';const p=c.order[c.step];const first=c.step===0;
  show(h('div',null,h('h1',null,'Round '+(m.round+1)+(m.round>=m.N?' (tie-break)':'')+' — '+c.cat.e+' '+c.cat.n),score(m),
    h('div',{class:'card',style:{textAlign:'center',marginTop:'14px'}},h('div',{class:'big-emo'},p===0?'🟣':'🟠'),h('h2',{id:'bt-turn'},m.names[p]+', you are up!'),h('p',{class:'mute'},first?'You answer first this round. Same questions for both players.':'Same questions as '+m.names[c.order[0]]+' had — answers are still hidden.'),h('p',{class:'mute'},'Best of '+m.N+' — first to '+m.rtw+' rounds wins. Pass the device to '+m.names[p]+' and press Ready.'),
      h('button',{class:'btn primary',id:'bt-ready',onClick:()=>question()},'✔ Ready'))),navs());}
function question(){const m=st.m,c=m.cur;m.phase='q';const p=c.order[c.step];const q=c.qs[c.qi];
  const root=h('div',null,h('h1',null,c.cat.e+' '+c.cat.n),score(m),h('div',{class:'row sp',style:{marginTop:'10px'}},h('b',{id:'bt-who'},m.names[p]+' — question '+(c.qi+1)+' of 2'),h('span',{id:'bt-tm'})),
    h('div',{class:'card',style:{marginTop:'8px'}},h('div',{class:'bq',id:'bt-q'},q.prompt),q.display?h('div',{class:'oddgrid',style:{fontSize:'1.6rem',gridTemplateColumns:'repeat(5,1fr)',textAlign:'center'}},q.display.map(x=>h('span',null,x))):null,
      q.kind==='grid'?h('div',{class:'oddgrid'},q.cells.map((x,i)=>h('button',{class:'btn','data-cell':i,'aria-label':'Tile '+(i+1),onClick:()=>answer(i)},x))):h('div',{class:'bopts'},q.options.map((o,i)=>h('button',{class:'btn','data-opt':i,onClick:()=>answer(i)},o)))),
    h('p',{class:'mute'},'Your answer is locked in when you tap — correctness stays hidden until both players have answered.'));
  show(root,navs());
  let live=true;BPA.onLeave(()=>{live=false;});
  if(m.timer){const t=BPA.makeTimer($('#bt-tm'),20,()=>setTimeout(()=>{if(live)answer(null);},400));}}
let busy=false;
function answer(i){if(busy)return;busy=true;const m=st.m,c=m.cur;const p=c.order[c.step];const q=c.qs[c.qi];c.ans[p][c.qi]=i;Score.attempt('battle',i!=null&&i===q.answer);
  const root=$('#view');root.querySelectorAll('button').forEach(b=>b.disabled=true);const msg=h('p',{class:'fb ok',role:'status'},i==null?'⏱ Time up — no answer recorded.':'🔒 Answer locked in!');root.append(msg);
  let dead=false;BPA.onLeave(()=>{dead=true;busy=false;});
  setTimeout(()=>{if(dead||st.m!==m)return;busy=false;if(c.qi===0){c.qi=1;question();}else{c.qi=0;if(c.step===0){c.step=1;handoff();}else reveal();}},650);}
function reveal(){const m=st.m,c=m.cur;m.phase='r';const cor=[0,1].map(p=>c.qs.filter((q,k)=>c.ans[p][k]===q.answer).length);
  const rw=cor[0]>cor[1]?0:cor[1]>cor[0]?1:-1;if(rw>=0)m.wins[rw]++;else m.draws++;m.rounds.push({cat:c.cat.id,cor,winner:rw});m.round++;
  const decided=m.wins[0]>=m.rtw||m.wins[1]>=m.rtw||(m.round>=m.N&&m.wins[0]!==m.wins[1])||m.round>=m.N+3;
  const ansText=(q,a)=>a==null?'—':q.kind==='grid'?'tile '+(a+1):q.options[a];
  const rows=c.qs.map((q,k)=>h('div',{class:'card',style:{marginBottom:'8px'}},h('b',null,'Q'+(k+1)+': '+q.prompt),h('p',null,'✅ Correct: ',h('b',null,ansText(q,q.answer))),
    h('p',null,[0,1].map(p=>h('span',{class:'chip'+(c.ans[p][k]===q.answer?' ok':''),style:{marginRight:'6px'}},m.names[p]+': '+ansText(q,c.ans[p][k])+(c.ans[p][k]===q.answer?' ✓':' ✗')))),h('p',{class:'mute'},q.explain)));
  const res=rw>=0?'🏅 '+m.names[rw]+' wins the round ('+cor[rw]+'–'+cor[1-rw]+')':'🤝 Round drawn ('+cor[0]+'–'+cor[1]+')';
  show(h('div',null,h('h1',null,'Round '+m.round+' result'),score(m),h('h2',{id:'bt-roundres',style:{textAlign:'center'}},res),rows,
    h('button',{class:'btn primary',id:'bt-next',onClick:()=>decided?finish():nextRound()},decided?'🏆 See match result':'Next round ▶')),navs({next:()=>decided?finish():nextRound()}));}
function finish(){const m=st.m;m.done=true;m.phase='f';const winner=m.wins[0]>m.wins[1]?0:m.wins[1]>m.wins[0]?1:-1;
  S.history.unshift({t:Date.now(),names:m.names.slice(),wins:m.wins.slice(),winner,N:m.N});S.history=S.history.slice(0,20);
  Score.raw('battle','m'+Date.now(),30);
  show(h('div',null,h('h1',null,'Match result'),score(m),h('div',{class:'card',style:{textAlign:'center'}},h('div',{class:'big-emo'},winner<0?'🤝':'🏆'),h('h2',{id:'bt-winner'},winner<0?'It is a draw — perfectly matched!':m.names[winner]+' wins the match!'),h('p',{class:'mute'},m.names[0]+' '+m.wins[0]+' – '+m.wins[1]+' '+m.names[1]+(m.draws?' ('+m.draws+' drawn round'+(m.draws>1?'s':'')+')':''))),
    h('div',{class:'card',style:{marginTop:'10px'}},h('h3',null,'Rounds'),m.rounds.map((r,i)=>h('p',null,'Round '+(i+1)+' — '+CATS.find(c=>c.id===r.cat).e+' '+CATS.find(c=>c.id===r.cat).n+': '+m.names[0]+' '+r.cor[0]+' / '+m.names[1]+' '+r.cor[1]+' → '+(r.winner<0?'draw':m.names[r.winner])))),
    h('div',{class:'row',style:{marginTop:'12px'}},h('button',{class:'btn primary',id:'bt-rematch',onClick:()=>startMatch()},'↻ Rematch'),h('button',{class:'btn',id:'bt-setup',onClick:setup},'Change settings'),h('button',{class:'btn',onClick:BPA.home},'🏠 Home'))),{back:setup,restart:()=>startMatch()});}
BPA.games.battle={open:setup,resume:setup,get state(){return st.m;},CATS};
})();
try{boot();}catch(err){document.getElementById('view').textContent='Startup error: '+err.message;console.error(err);}
</script>
